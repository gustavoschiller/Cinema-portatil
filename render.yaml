services:
  - type: web
    name: cinema
    runtime: node
    plan: free
    rootDir: arquivos
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: node server.js
    healthCheckPath: /config
    envVars:
      # A senha e por sala, escolhida por quem cria - nao tem senha aqui.
      - key: MAX_PEERS
        value: "4"
      # Teto de salas simultaneas: sem isso alguem pode usar o seu servico
      # como infraestrutura propria.
      - key: MAX_ROOMS
        value: "20"
